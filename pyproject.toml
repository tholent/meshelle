[project]
name = "meshelle"
version = "0.1.0"
description = "A dedicated MeshCore room server, hosted on a computer with a companion node as its radio"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Chris Wells", email = "chris@rhza.org" }]
keywords = ["meshcore", "lora", "mesh", "room-server"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Ham Radio",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.13",
    "cryptography>=43",
    "pydantic>=2.8",
    "pyserial-asyncio-fast>=0.16",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
ble = ["bleak>=0.22"]

[project.scripts]
meshelle = "meshelle.cli:main"

[project.urls]
Homepage = "https://github.com/cwlls/meshelle"
Issues = "https://github.com/cwlls/meshelle/issues"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meshelle"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ARG",    # unused arguments
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "PTH",    # flake8-use-pathlib
    "RET",    # flake8-return
    "RUF",    # ruff-specific
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    # MeshCore uses AES-128-ECB and 2-byte truncated HMACs as its wire format.
    # We do not get to choose; flagging it on every call site is pure noise.
    "S303",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "ARG001", "ARG002"]
"src/meshelle/store/migrations/versions/*" = ["D", "E501", "I"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_generics = true
warn_return_any = true
mypy_path = "scripts"
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# Generated migration scripts are not worth annotating.
module = "meshelle.store.migrations.versions.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["serial_asyncio_fast.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/meshelle"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
