# Alembic configuration for meshelle.
#
# script_location and sqlalchemy.url are both overridden at runtime by
# meshelle.store.migrate, which knows the installed package path and the
# configured database location. They are set here only so the `alembic` CLI is
# usable directly from a source checkout during development.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Alembic warns without this and falls back to splitting on spaces, commas and
# colons. We run with warnings-as-errors, so the legacy fallback is a hard error.
path_separator = os
sqlalchemy.url = sqlite+pysqlite:///data/meshelle.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
